<text x="926" y="578" font-size="12" font-weight="700" fill="#1F7A46" text-anchor="middle">端末どうし（ピア）で配り合う</text>
<circle cx="648" cy="616.5" r="5" fill="none" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="668" y="621.0" font-size="13" font-weight="400" fill="#2A6B45" text-anchor="start">配信が速く、失敗も減る</text>
<circle cx="648" cy="641.2" r="5" fill="none" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="668" y="645.7" font-size="13" font-weight="400" fill="#2A6B45" text-anchor="start">業務通信を止めない</text>
<circle cx="648" cy="665.9" r="5" fill="none" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="668" y="670.4" font-size="13" font-weight="400" fill="#2A6B45" text-anchor="start">回線コストを抑えられる</text>
<rect x="64" y="772" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="88" y="798" width="46" height="46" rx="12" fill="#F3EEFA"/>
<g transform="translate(100.6,808.0) scale(0.65)"><rect x="2" y="2" width="28" height="36" rx="4" stroke="#5B2A87" stroke-width="2.2" fill="none"/><line x1="6" y1="12" x2="26" y2="12" stroke="#5B2A87" stroke-width="1.6"/><line x1="6" y1="20" x2="26" y2="20" stroke="#5B2A87" stroke-width="1.6"/><line x1="6" y1="28" x2="26" y2="28" stroke="#5B2A87" stroke-width="1.6"/></g>
<text x="88" y="875" font-size="16" font-weight="700" fill="#241B33" text-anchor="start">優先サーバ</text>
<text x="88" y="898" font-size="13" font-weight="400" fill="#5A4A78" text-anchor="start">拠点に1回運べば、あとは社内で配る</text>
<text x="88" y="935" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・同じファイルを台数分ダウンロードしない</text>
<text x="88" y="958" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・拠点ごとに置けば拠点間・FW越えの通信減</text>
<text x="88" y="981" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・サーバが落ちても別経路へ自動で切替</text>
<text x="88" y="1004" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・足りないパッチだけを自動的にダウンロード</text>
<rect x="429" y="772" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="453" y="798" width="46" height="46" rx="12" fill="#E9F5F6"/>
<g transform="translate(464.0,809.0)"><path d="M17 2l4 4-4 4" stroke="#0E7C86" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 6H8a4 4 0 0 0-4 4v1" stroke="#0E7C86" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M7 22l-4-4 4-4" stroke="#0E7C86" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18h13a4 4 0 0 0 4-4v-1" stroke="#0E7C86" stroke-width="2" fill="none" stroke-linecap="round"/></g>
<text x="453" y="875" font-size="16" font-weight="700" fill="#241B33" text-anchor="start">ピアダウンロード</text>
<text x="453" y="898" font-size="13" font-weight="400" fill="#0E7C86" text-anchor="start">端末どうしで配り合う</text>
<text x="453" y="935" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・優先サーバを置けない拠点でも効果が出る</text>
<text x="453" y="958" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・台数が多いほど効率が上がる</text>
<text x="453" y="981" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・1台が落ちても他の端末から取得できる</text>
<text x="453" y="1004" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・拠点内の速い回線だけで配信が完結</text>
<rect x="795" y="772" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="819" y="798" width="46" height="46" rx="12" fill="#FCF1DC"/>
<g transform="translate(830.0,809.0)"><path d="M4 15a8 8 0 0 1 16 0" stroke="#A8720F" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="12" y1="15" x2="16" y2="9" stroke="#A8720F" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="#A8720F"/></g>
<text x="819" y="875" font-size="16" font-weight="700" fill="#241B33" text-anchor="start">帯域制御</text>
<text x="819" y="898" font-size="13" font-weight="400" fill="#A8720F" text-anchor="start">パッチ配信で業務を止めない</text>
<text x="819" y="935" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・LAN と WAN それぞれに使用上限を設定</text>
<text x="819" y="958" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・細い回線や従量課金の拠点でも安心</text>
<text x="819" y="981" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・日中でも配信でき、夜間作業に縛られない</text>
<text x="819" y="1004" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start">・業務システムの通信を優先できる</text>
</svg>