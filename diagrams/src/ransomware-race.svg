<text x="688" y="541" font-size="12.5" font-weight="700" fill="#1F7A46" text-anchor="start">ランサムウェア関連と判明した時点で、そのまま塞げる</text>
<text x="688" y="561" font-size="11" font-weight="400" fill="#2A6B45" text-anchor="start">ランサムウェア関連は検証を待たず、即時配布に切り替える</text>
