<text x="670" y="633" font-size="12.5" font-weight="400" fill="#2A6B45" text-anchor="start">人を介した引き継ぎが工程から消える</text>
<circle cx="652" cy="653.5" r="5" fill="none" stroke="#2E9E5B" stroke-width="1.6"/>
<text x="670" y="658" font-size="12.5" font-weight="400" fill="#2A6B45" text-anchor="start">緊急時は検証を待たず即時配布に切り替えられる</text>
<rect x="64" y="760" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="88" y="786" width="46" height="46" rx="12" fill="#F3EEFA"/>
<g transform="translate(91,789) scale(0.98)" fill="none" stroke="#5B2A87" stroke-width="2"><circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="8"/><circle cx="20" cy="20" r="2" fill="#5B2A87" stroke="none"/><line x1="20" y1="20" x2="31" y2="10" stroke-linecap="round"/></g>
<text x="88" y="863" font-size="15" font-weight="700" fill="#241B33" text-anchor="start">ランサムウェア悪用中の脆弱性が分かる</text>
<text x="88" y="886" font-size="13" font-weight="400" fill="#5B2A87" text-anchor="start">攻撃者の動きが対処の合図になる</text>
<text x="88" y="923" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・ランサムウェアに悪用中かどうかを直接フラグ表示</text>
<text x="88" y="946" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・自社の脅威リサーチがデータの裏付け</text>
<text x="88" y="969" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・スコアではなく脅威の動きが起点になる</text>
<text x="88" y="992" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・定時スキャンを待たずに動き出せる</text>
<rect x="429" y="760" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="453" y="786" width="46" height="46" rx="12" fill="#E9F5F6"/>
<g transform="translate(456,789) scale(0.98)" fill="none" stroke="#0E7C86" stroke-width="2"><circle cx="9" cy="20" r="6"/><circle cx="31" cy="20" r="6"/><line x1="15" y1="20" x2="25" y2="20" stroke-linecap="round"/><line x1="20" y1="8" x2="20" y2="32" stroke-linecap="round" stroke-dasharray="3 3"/></g>
<text x="453" y="863" font-size="15" font-weight="700" fill="#241B33" text-anchor="start">脆弱性管理からパッチ管理がシームレス</text>
<text x="453" y="886" font-size="13" font-weight="400" fill="#0E7C86" text-anchor="start">止まる時間をつくらない</text>
<text x="453" y="923" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・危険と判定した対象をそのまま配信対象にできる</text>
<text x="453" y="946" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・脆弱性一覧の取りまとめが不要になる</text>
<text x="453" y="969" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・部門をまたぐ受け渡しが工程から消える</text>
<text x="453" y="992" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・対処後の状態を同じ画面で確認できる</text>
<rect x="795" y="760" width="341" height="268" rx="16" fill="#FFFFFF" stroke="#E3DFEC" stroke-width="1.5"/>
<rect x="819" y="786" width="46" height="46" rx="12" fill="#FCF1DC"/>
<g transform="translate(822,789) scale(0.98)" fill="none" stroke="#A8720F" stroke-width="2"><circle cx="20" cy="20" r="15" stroke-dasharray="6 5"/><path d="M13 20 l5 5 l9 -10" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="819" y="863" font-size="15" font-weight="700" fill="#241B33" text-anchor="start">緊急時は即時配布に切り替える</text>
<text x="819" y="886" font-size="13" font-weight="400" fill="#A8720F" text-anchor="start">平時と有事で運用を変える</text>
<text x="819" y="923" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・平時はリング配布で段階的に検証を挟む</text>
<text x="819" y="946" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・ランサムウェア関連は検証を待たず即時配布</text>
<text x="819" y="969" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・リスクに応じて対応方針を自動化</text>
<text x="819" y="992" font-size="12" font-weight="400" fill="#444444" text-anchor="start">・万が一のときはロールバックで戻せる</text>
