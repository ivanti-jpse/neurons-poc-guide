site_name: Ivanti Neurons Platform - POCガイド
site_description: Ivanti Neurons Platform の設定・POCガイド
site_url: https://ivanti-jpse.github.io/neurons-poc-guide/

theme:
  name: material
  language: ja
  palette:
    # Ivantiブランドカラーは extra.css で上書き(custom を指定)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hide-section.js
  - javascripts/image-zoom.js

nav:
  - ホーム: index.md
  - 前提条件:
      - ネットワーク要件: prerequisites/network-requirements.md
      - プラットフォーム要件: prerequisites/platform-requirements.md
      - パッチ要件: prerequisites/patch-requirements.md
      - ブラウザ要件: prerequisites/browser-requirements.md
  - 設定手順:
      - エージェントのインストール: neurons/agent-install.md
      - パッチ管理: neurons/patch-management.md
      - リモート コントロール: neurons/remote-control.md
      - アプリの配布: neurons/app-distribution.md
      - Edge Intelligence: neurons/edge-intelligence.md
      - ボット: neurons/bots.md
      - エージェントのアンインストール: neurons/agent-uninstall.md
  - POC 検証項目:
      - エージェントのインストール: checklist/agent-install.md
      - パッチ管理: checklist/patch-management.md
      - リモート コントロール: checklist/remote-control.md
      - アプリの配布: checklist/app-distribution.md
      - Edge Intelligence: checklist/edge-intelligence.md
      - ボット: checklist/bots.md
      - エージェントのアンインストール: checklist/agent-uninstall.md
  - 特長:
      - 効率的なパッチ配信: features/traffic-control.md
      - マルチOS・アプリ・ドライバ更新対応: features/patch-coverage.md
      - パッチ優先順位と不具合パッチ混入の回避: features/patch-prioritization.md
      - ランサムウェア対応: features/ransomware-race.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.keys

plugins:
  - search:
      lang: ja
